name: Create Resend draft

# Push a new post -> a Resend DRAFT broadcast is created for it (never auto-sent).
# Review the draft in the Resend dashboard, then hit Send there.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   RESEND_API_KEY      (full access key)
#   RESEND_AUDIENCE_ID  (your segment id)
#   RESEND_FROM         e.g.  ben-mini <ben@ben-mini.com>
#   RESEND_REPLY_TO     (optional)

on:
  # Manual run for any post (defaults to the latest one)
  workflow_dispatch:
    inputs:
      post:
        description: "Post slug/filename, or 'latest'"
        default: latest
        required: true
  # Auto: only when a post file is added/changed on gh-pages
  push:
    branches: ["gh-pages"]
    paths: ["_posts/**"]

# Don't pile up overlapping runs
concurrency:
  group: resend-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff added files

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide which posts to draft
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: create-or-update a draft for the requested post.
            echo "created=${{ github.event.inputs.post }}" >> "$GITHUB_OUTPUT"
            echo "updated=" >> "$GITHUB_OUTPUT"
          else
            BEFORE='${{ github.event.before }}'
            # On a brand-new branch 'before' is all-zeros; fall back to the previous commit.
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
            DIFF=$(git diff --name-status "$BEFORE" "${{ github.sha }}" -- _posts)
            ADDED=$(echo "$DIFF" | awk '$1=="A"{print $2}' | xargs -n1 -I{} basename {} 2>/dev/null | tr '\n' ' ')
            MODIFIED=$(echo "$DIFF" | awk '$1=="M"{print $2}' | xargs -n1 -I{} basename {} 2>/dev/null | tr '\n' ' ')
            echo "Added (create draft): ${ADDED:-(none)}"
            echo "Modified (refresh existing draft only): ${MODIFIED:-(none)}"
            echo "created=$ADDED" >> "$GITHUB_OUTPUT"
            echo "updated=$MODIFIED" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update Resend draft(s)
        if: steps.pick.outputs.created != '' || steps.pick.outputs.updated != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO }}
        run: |
          for p in ${{ steps.pick.outputs.created }}; do
            echo "::group::Create/update draft for $p"
            node send.js "$p"
            echo "::endgroup::"
          done
          for p in ${{ steps.pick.outputs.updated }}; do
            echo "::group::Refresh draft (if any) for $p"
            node send.js "$p" --update-only
            echo "::endgroup::"
          done

      - name: Nothing to do
        if: steps.pick.outputs.created == '' && steps.pick.outputs.updated == ''
        run: echo "No added or modified posts in this push — nothing to do."
